        characters: [⁣U+2063]
      - concept: invisible-times
        characters: [⁢U+2062]


concepts:
  
  ## ================ 4.4.1 functions and inverses ====================
  
  - concept: closed-open-interval
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: interval between $a1 (included) and $a2
      fr: intervalle ouvert à droite entre $a1 et $a2
  
  - concept: open-closed-interval
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en:  interval between $a1 and $a2, included
      fr: intervalle ouvert à gauche...
  
  - concept: open-interval
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: open interval between $a1 and $a2
      fr: intervalle ouvert
  
  - concept: closed-interval
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: closed interval between $a1 and $a2
      fr: intervalle fermé entre $a1 et $a2

  - concept: inverse
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function*
    speech:
      en: inverse of $a1
    comments:
      - "`inverse` can be used for function inverses, matrix inverses, etc."
  
  - concept: inverse
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: postfix
    speech:
      en: $a1 inverse
  
  - concept: domain
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: domain of $a1
      fr: domaine de définition de $a1
  
  - concept: codomain
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: codomain of $a1
      fr: ensemble d'arrivée de $a1
  
  - concept: image
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function*
    speech:
      en: image of $a1
      fr: image de $a1
  
  - concept: fraction
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: fraction $a1 over $a2 end fraction
  
  - concept: mixed-fraction
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: $a1 and $a2
    comments:
      - "$a1 is a positive integer and $a2 is a fraction with positive numerical components.
        The second argument can be an `mfrac` (normal or beveled) or can be a linear fraction using `/`"
  
  - concept: quotient
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: integer part of $a1 divided by $a2
      fr: quotient de $a1 par $a2
  
  - concept: evaluated-at
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: $a1 evaluated-at $a2
    comments:
      - "Two common notations are
        <math><mrow><msub><mrow><mrow><mrow><msup><mi>x</mi><mn>2</mn></msup></mrow><mo>|</mo></mrow></mrow><mn>3</mn></msub></mrow></math>
        and
        <math>
          <msub>
              <mrow>
                  <msup><mi>x</mi><mn>2</mn></msup>
                  <mo>|</mo>
              </mrow>
              <mrow><mi>x</mi><mo>=</mo><mn>3</mn></mrow>
          </msub>
        </math>
        "
  - concept: remainder
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: the remainder of $a1 divided by $a2
      fr: reste de la divsion de $a1 par $a2
  
  - concept: max
    subject-area: functions and inverses
    arity: ">=1"
    arguments: [$a1, ...]
    property: function
    speech:
      en: "max of $a1, ..."
  
  - concept: min
    subject-area: functions and inverses
    arity: ">=1"
    arguments: [$a1, ...]
    property: function
    speech:
      en: "min of $a1, ..."
  
  - concept: power
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    conditions:
      - condition: "$a2=2"
        speech:
          en: "$a1 squared"
          fr: "$a1 carré"
      - condition: "$a2=3"
        speech:
          en: "$a1 cubed"
          fr: "$a1 cube"
      - condition: ""
        speech:
          en: "$a1 to the $a2<i>th</i> power"
          fr: "$a1 à la $a2"
  
  
  - concept: root
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    conditions:
      - condition: "$a2=2"
        speech:
          en: "square root of $a1"
      - condition: "$a2=3"
        speech:
          en: "cube root of $a1"
      - condition: "$a2=4"
        speech:
          en: "fourth root of $a1"
      - condition: ""
        speech:
          en: "$a2<i>th</i> root of $a1"
  
  - concept: greatest-common-divisor
    subject-area: functions and inverses
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: greatest common divisor of $a1, $a2, ...
      fr: plus grand commun diviseur de $a1, $a2, ...
  
  - concept: least-common-multiple
    subject-area: functions and inverses
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: lest common multiple of  $a1, $a2, ...
      fr: plus grand commun diviseur de $a1, $a2, ...
  
  - concept: least-common-denominator
    subject-area: functions and inverses
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: "least common denominator of $a1, $a2, ..."

  - concept: absolute-value
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: absolute value of $a1
      fr: valeur absolue de $a1
      de: Betrag von $a1
  
  - concept: complex-conjugate
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: complex conjugate of $a1
      fr: $a1 conjugé
  
  - concept: complex-arg
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: arg of $a1
  
  - concept: real-part
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en:
        - real part of $a1
        - imaginary part of $a1
    
  - concept: imaginary-part
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: imaginary part of $a1
  
  - concept: polar-coordinate
    subject-area: functions and inverses
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: "polar coordinate $a1 comma $a2"
    comment:
    - "The first argument is the radius, the second argument is the polar angle, the third arguments is the azimuthal angle."
    - "Example: <math><mo>(</mo><mi>r</mi><mo>,</mo><mo>&#xA0;</mo><mi>&#x3B8;</mi><mo>)</mo></math>"
  
  - concept: spherical-coordinate
    subject-area: functions and inverses
    arity: 3
    arguments: [$a1, $a2, $a3]
    property: function
    speech:
      en: "spherical coordinate $a1 comma $a2, comma $a3"
    comment:
    - "The first argument is the radius, the second argument is the angle."
    - "Example: <math><mo>(</mo><mi>r</mi><mo>,</mo><mi>&#x3A6;</mi><mo>,</mo><mi>&#x3B8;</mi><mo>)</mo></math>"
  
  - concept: cartesian-coordinate
    subject-area: functions and inverses
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: "cartesian coordinate $a1 comma $a2 ..."
    comment:
    - "Example: <math><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo></math>"
  
  - concept: coordinate
    subject-area: functions and inverses
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: "coordinate $a1 comma $a2 ..."
    comment:
    - "This a generic coordinate that doesn't specify the coordinate system. It takes 2 or more arguments."
    - "Example: <math><mo>(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>)</mo></math>"
  
  - concept: floor
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: floor of $a1
  
  - concept: ceiling
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: ceiling of $a1
  
  - concept: round
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: rounded-value of $a1
    comments:
      - "This sometimes uses the notation
        <math><mo>&#x230A;</mo><mi>x</mi><mo>&#x2309;</mo></math>
        or
        <math><mo>[</mo><mi>x</mi><mo>]</mo></math>"
  
  - concept: fractional-part
    subject-area: functions and inverses
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: fractional part of $a1
  
  ## ====================== 4.4.4 Calculus ============================
  - concept: definite-integral
    subject-area: calculus
    arity: 1
    arguments: [$a1]
    property: ???
    speech:
      en: "integral over $a1"
    comments:
      - "integral sign is not an argument"
  
  - concept: definite-integral
    subject-area: calculus
    arity: 2
    arguments: [$a1, $a2]
    property: ???
    speech:
      en: "integral from $a1 to $a2"
    comments:
      - "integral sign is not an argument"
  
  
  - concept: derivative
    subject-area: calculus
    arity: 3
    arguments: [$a1, $a2, $a3]
    property: ???
    speech:
      en:
        - "(verbose) the $a3 derivative of $a1 with respect to $a2"
        - "(terse) d <$a3 if $a3 != 1> $a1 by d $a2 <$a3 if $a3 != 1>"
    comments:
      - "the terse reading only makes sense for Leibniz notation such as 
          <math><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>y</mi></mrow><mrow><mi>d</mi><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac></math>
          or
          <math><mfrac><msup><mi>d</mi><mn>2</mn></msup><mrow><mi>d</mi><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac><mi>f</mi><mrow><mo>(</mo><mi>x</mi><mo>)</mo></mrow></math>.
          It does not make sense for other notations such as 
          <math><msup><mi>f</mi><mo>''</mo></msup><mrow><mo>(</mo><mi>x</mi><mo>)</mo></mrow></math>
          "
      - "The first of these examples might be marked up as"
      - |
          ```
          <mfrac intent='derivative(y, x, 2)'>
            <mrow>
              <msup><mi>d</mi><mn arg>2</mn></msup>
              <mi>y</mi>
            </mrow>
            <mrow>
              <mi>d</mi>
              <msup><mi>x</mi><mn>2</mn></msup>
            </mrow>
          </mfrac>
          ```
  
  
  - concept: partial-derivative
    subject-area: calculus
    arity: ">=3"
    arguments: [$a1, $a2, $a3, ...]
    property: ???
    speech:
      en:
        - "partial <sum $a3+2i> $a1 partial $a2 <$a3 if $a3 != 1> [partial $a4 <$a5 if $a5 != 1> ...]"
    comments:
      - |
        ```
        <mfrac intent='partial-derivative($f, x, 2, y, 1)'>
          <mrow>
              <msup><mo>&#x2202;</mo><mn>3</mn></msup>
              <mrow arg='f'><mi>sin</mi><mo>(</mo><mi>x</mi><mo>)</mo><mi>y</mi></mrow>
          </mrow>
          <mrow>
              <msup><mo>&#x2202;</mo><mn>2</mn></msup>
              <mi>x</mi><mo>&#x2202;</mo><mi>y</mi>
          </mrow>
        </mfrac>
        ```
  
  - concept: limit
    subject-area: calculus
    arity: 1
    arguments: [$a1]
    property: prefix
    speech:
      en: "limit as $a1"
    comments:
      - "limit is not an argument, but intent should be on `msub` or `munder`"
      - "There are several arrows used for limits. "
      - "Example: <math>
              <munder intent='limit($lim)'>
                  <mi>lim</mi>
                  <mrow arg='lim' intent='tends-to-from-below($x, $val)'><mi arg='x'>x</mi><mo>↗</mo><mn arg='val'>0</mn></mrow>
              </munder>
          </math>
          might be spoken as \"limit as x tends to from below 0\" and marked up as:"
      - |
        ```
        <munder intent='limit($lim)'>
            <mi>lim</mi>
            <mrow arg='lim' intent='tends-to-from-below($x, $val)''>
              <mi arg='x'>x</mi>
              <mo>↗</mo>
              <mn arg='val'>0</mn>
            </mrow>
        </munder>
        ```
      - "Another notation that might be spoken similarly is
        <math><munder><mrow><mi>l</mi><mi>i</mi><mi>m</mi></mrow><mrow><mi>x</mi><mo>→</mo><msup><mn>0</mn><mo>-</mo></msup></mrow></munder></math>
        "
  
  - concept: tends-to
    subject-area: calculus
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: "$a1 tends to $a2"
    comments:
      - "see \"limit\" example"
  
  - concept: tends-to-from-above
    subject-area: calculus
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: "$a1 tends to from above $a2"
    comments:
      - "see \"limit\" example"
  
  - concept: tends-to-from-below
    subject-area: calculus
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: "$a1 tends to from below $a2"
    comments:
      - "see \"limit\" example"
  
  ## ====================== 4.4.5 Sets ============================
  - concept: set
    subject-area: sets
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "set of $a1"
    comments:
      - |
               the argument to `set` is typically an `mrow`. For example:
    
               ```
               <math>
                <mrow intent='set($members)'>
                 <mo>{</mo>
                 <mrow arg='members'>
                  <mn>2</mn>
                  <mo>,</mo>
                  <mn>4</mn>
                  <mo>,</mo>
                  <mn>6</mn>
                  <mo>,</mo>
                  <mn>8</mn>
                 </mrow>
                 <mo>}</mo>
                </mrow>
               </math>
               ```
  
  - concept: set-difference
    subject-area: sets
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: "set difference of $a1 and $a2"
    comments:
      - "This can be spoken in many ways. See other entry for infix speech."
      - "There are several notations that are used and their order of appearance differs:
        <math><mi>A</mi><mo>-</mo><mi>B</mi></math>, <math><mi>A</mi><mo>\\</mo><mi>B</mi></math>"
  
  - concept: set-difference
    subject-area: sets
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: "\"$a1 minus $a2\" or \"$a2 subtracted from $a1\""
    comments:
      - "This can be spoken in many ways. See other entry for functional speech."
      - "See functional form for some notational usages."
  
  - concept: complement
    subject-area: sets
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "complement of $a1"
    comments:
      - "This can be spoken in many ways. See other entry for functional speech."
      - "Two notations used for complement are: 
        <math><msup><mi>A</mi><mi>C</mi></msup></math>, <math><msup><mi>A</mi><mo>'</mo></msup></math>"
  
  - concept: empty-set
    subject-area: sets
    arity: 0
    arguments: []
    speech:
      en: "empty set"
    comments:
      - "Three notations used for empty set are: { }, ∅, and ∅"
  
  
  - concept: cardinality
    subject-area: sets
    arity: 1
    arguments: [$a1]
    property: function
    comments:
      - "often used with matchfix single vertical bars"
  
  - concept: list
    subject-area: sets
    arity: ">=0"
    arguments: [$a1, ...]
    speech:
      en: "list of $a1, ..."
  
  - concept: tuple
    subject-area: sets
    arity: ">=0"
    arguments: [$a1, ...]
    speech:
      en: "tuple of $a1, ..."
  
  ## ====================== 4.4.6 sequence and series ============================
  - concept: sum
    subject-area: sequences and series
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "sum of $a1"
    comments:
      - usually on `<mrow>`
  
  - concept: sum
    subject-area: sequences and series
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: "sum over $a1 of $a2"
    comments:
      - usually on `<munder>` or `<msub>`
  
  - concept: sum
    subject-area: sequences and series
    arity: 3
    arguments: [$a1, $a2, $a3]
    property: function
    speech:
      en: "sum from $a1 to $a2 of $a3"
    comments:
      - usually on `<munderover>` or `<msubsup>`
  

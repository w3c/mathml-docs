        characters: ["%"]

  - fixity: nofix
    concepts:
      - concept: diameter
        characters: ["d"]
      - concept: distance
        characters: ["d", "D"]
      - concept: probability
        characters: ["P"]
      - concept: radius
        characters: ["r"]
      - concept: volume
        characters: ["V"]

  - fixity: silent
    concepts:

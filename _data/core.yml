      - concept: divided-by
        characters: [/, ÷, ":"]
      - concept: divides
        characters: ["|", "∣"]
      - concept: does-not-belong-to
        characters: [∉]
      - concept: does-not-divide
        characters: [∤]
      - concept: dot-product
        characters: ["·"]
      - concept: downwards-diagonal-ellipsis
        characters: ["⋱"]
      - concept: direct-product
        characters: [×]
      - concept: element-of
        characters: [∈, ∊]
      - concept: ellipsis
        characters: ["…", "⋯"]
      - concept: equals
        characters: ["="]
      - concept: equivalent-to
        characters: [≡]
      - concept: evaluates-to
        characters: ["→"]
      - concept: given
        characters: ["|"]
      - concept: greater-than
        characters: ["&gt;"]
      - concept: greater-than-or-equal-to
        characters: [≥, ≧]
      - concept: identically-equals
        characters: [≡]
      - concept: if-and-only-if
        characters: ["⟺"]
      - concept: implies
        characters: [⇒]
      - concept: inner-product
        characters: [⋅]
      - concept: intersection
        characters: [∩]
      - concept: less-than
        characters: ["&lt;"]
      - concept: less-than-or-equal-to
        characters: [≤, ≦]
      - concept: list-separator
        characters: [",", ";"]
      - concept: maps-to
        characters: ["→"]
      - concept: member-of
        characters: [∈, ∊]
      - concept: minus
        characters: ["-", "−"]
      - concept: minus-or-plus
        characters: [∓]
      - concept: not-subset
        characters: [⊄]
      - concept: not-superset
        characters: [⊅]
      - concept: not-equal-to
        characters: [≠]
      - concept: not-member-of
        characters: [∉]
      - concept: not-parallel-to
        characters: [∦]
      - concept: obtained-from
        characters: [←]
      - concept: or
        characters: [∨]
      - concept: outer-product
        characters: [⊗]
      - concept: parallel-to
        characters: [∥]
      - concept: perpendicular
        characters: ["⟂"]
      - concept: plus
        characters: [+, U+2064]
      - concept: plus-or-minus
        characters: [±]
      - concept: precedes
        characters: [≺]
      - concept: proportional
        characters: [∝, ∷, ∼, ~]
      - concept: range-separator
        characters: ["-", "‐", "‑", "–", "—"]
      - concept: ratio
        characters: [":", "∶"]
      - concept: set-difference
        characters: ["∼", "~", "-", "−", "\\"]
      - concept: similar
        characters: [≅]
      - concept: subset
        characters: [⊂]
      - concept: subset-or-equal
        characters: [⊆]
      - concept: succeeds

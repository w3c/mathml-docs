    comments:
      - "There are many notations for this: some of them are 
          <math>
            <msubsup><mi>P</mi><mi>k</mi><mi>n</mi></msubsup>
            <mo>,</mo><mo>&#xA0;</mo>
            <mmultiscripts><mi>P</mi><mi>k</mi><none/><mprescripts/><mi>n</mi><none/></mmultiscripts>
            <mo>,</mo><mo>&#xA0;</mo>
            <mmultiscripts><mi>P</mi><mi>k</mi><none/><mprescripts/><none/><mi>n</mi></mmultiscripts>
            <mo>,</mo><mo>&#xA0;</mo>
            <msub><mi>P</mi><mrow><mi>n</mi><mo>,</mo><mi>k</mi></mrow></msub>
            <mo>,</mo><mo>&#xA0;</mo>
            <mi>P</mi><mo>(</mo><mi>n</mi><mo>,</mo><mi>k</mi><mo>)
            </mo><mo>,</mo><mo>&#xA0;</mo>
            <msup><mi>n</mi><menclose notation='bottom'><mi>k</mi></menclose></msup>
        </math>"
      - "The first of these would be marked up as:"
      - |
        ```
        <msubsup intent='pochhammer($n, $k)'>
            <mi>P</mi>
            <mi arg='k'>k</mi>
            <mi arg='n'>n</mi>
        </msubsup>
        ```
  
  - concept: permutation-cycle
    subject-area: General Concepts
    arity: ">=2"
    arguments: [$a1, $a2, ...]
    property: function
    speech:
      en: "permutation cycle of $a1 $a2 ..."
    comments:
      - "A common notation for a permutation cycle is <math><mo>(</mo>
              <mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>3</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable>
              <mo>)</mo></math>"
      - "This would be marked up as:"
      - |
        ```
        <mrow intent='permutation-cycle($arg1, $arg2, $arg3)'
        <mo>(</mo>
          <mtable><mtr>
             <mtd><mn arg='arg1'>1</mn></mtd>
             <mtd><mn arg='arg2'>3</mn></mtd>
             <mtd><mn arg='arg3'>2</mn></mtd>
          </mtr></mtable>
        <mo>)</mo>
        ```
  
  - concept: embellished-name
    subject-area: General Concepts
    arity: 2
    arguments: [$a1, $a2]
    property: infix
    speech:
      en: "$a1 with annotation $a2"
    comments:
      - "used with `mover` or `munder`"
   
     
  - concept: fenced-group
    subject-area: Grouping
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "fenced-group of $a1"
    comments:
      - "this includes parens, brackets, and braces"
  
  - concept: annotation
    subject-area: Grouping
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: "$a1 which is $a2"
    comments:
      - "used with `mover` or `munder`"
      - "Example: <math><munder><munder><mrow><msub><mi mathvariant='normal'>H</mi><mn>2</mn></msub><mi mathvariant='normal'>O</mi></mrow><mo>&#x23DF;</mo></munder><mtext>water</mtext></munder></math>"
  
  - concept: braced-group
    subject-area: Grouping
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "grouped $a1 end-grouped"
    comments:
      - "used with `mover` or `munder`"
      - "Example: <math><munder><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>6</mn></mfrac></mrow><mo>&#x23DF;</mo></munder></math>"
  
  - concept: repeating-decimal
    subject-area: Grouping
    arity: 1
    arguments: [$a1]
    property: function
    speech:
      en: "repeating decimal $a1"
    comments:
      - "typically used in when there is a bar over the repeating part of a decimal or dots over the first and last digits."
      - "Example: <math><mfrac><mn>1</mn><mn>22</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>0</mn><mover><mn>45</mn><mo>_</mo></mover></math>"
      - "This right hand side of this might be might be marked up as:"
      - |
        ```
        <mn>0.0</mn>
        <mover intent='repeating-decimal($repeat)'>
            <mn arg='repeat'>45</mn>
            <mo>_</mo>
        </mover>
        ```
      - "or using the elementary math elements in MathML full as"
      - |
        ```
        <mstack intent='_(0.0, repeating-decimal(45)'>
          <msline length="2"/>
          <mn>0.045</mn>
        </mstack>
        ```


## Defaults:
### - property infix => arity 2
### - property prefix => arity 1
### - property suffix => arity 1
### - property set, number => arity 0


defaultfixity:
  - fixity: function
    concepts:
      - concept: curl
        characters: [∇]
      - concept: divergence
        characters: [∇]
      - concept: gradient
        characters: [∇]
      - concept: laplacian
        characters: [∆]

  - fixity: prefix
    concepts:
      - concept: angle
        characters: [∠]
      - concept: angle-measure
        characters: [∡]
      - concept: change
        characters: ["Δ"]
      - concept: for-all
        characters: [∀]
      - concept: measured-angle
        characters: [∡]
      - concept: minus
        characters: ["-", "−"]
      - concept: not
        characters: [¬]
      - concept: number-of
        characters: ["#"]
      - concept: partial-derivative
        characters: [∂]
      - concept: right-angle
        characters: [∟]
      - concept: square-root-of
        characters: [√]
      - concept: there-does-not-exist
        characters: [∄]
      - concept: there-exists
        characters: [∃]

  - fixity: infix
    concepts:
      - concept: and
        characters: [⁤∧]
      - concept: applied-to
        characters: [⁡U+2061]
      - concept: approximately
        characters: [≈]
      - concept: congruent
        characters: [≅]
      - concept: cartesian-product
        characters: [×]
      - concept: composed-with
        characters: [∘]
      - concept: cross-product
        characters: [×]
      - concept: defined-as
        characters: ["≝", "=", "≔"]
      - concept: dimensional-product
        characters: [×]

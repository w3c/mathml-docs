    subject-area: Statistics and Probability
    arity: 2
    arguments: [$a1, $a2]
    property: function
    speech:
      en: "probability of $a1 given $a2"
    comments:
      - |
                The intent should be on the `mrow` that includes the "P"
      
                 ```
                 <math>
                  <mrow intent='conditional-probability($arg1, $arg2)'>
                   <mi>P</mi>
                   <mo>(</mo>
                   <mrow>
                    <mi arg='arg1'>A</mi>
                     <mo>|</mo>
                     <mi arg='arg2'>B</mi>
                   </mrow>
                   <mo>)</mo>
                  </mrow>
                 </math>
                 ```
  
